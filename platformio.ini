; Configure la cible ESP32, le framework ESP-IDF et le moniteur série.
[platformio]
; ESP-IDF refuse les espaces dans le dossier de compilation.
; Les sources restent dans Nextcloud ; les artefacts restent locaux.
build_dir = ${sysenv.LOCALAPPDATA}/CroqChat/build

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = espidf
upload_port = COM4
monitor_port = COM4
upload_speed = 115200
monitor_speed = 115200
build_flags = -Wall -Wextra
